[Settings]
; 1 = on, 0 = off (Ctrl+key switches it in game)
Enabled=1
; Hotkey as a Windows virtual-key code in decimal. 120 = F9.
;   key        open the Chopagotchi app (or show a status message with [Phone] App=0)
;   Ctrl+key   switch the mod on/off
;   Shift+key  next collar
Key=120
; 1 = show messages above the minimap
Notifications=1

[Hud]
; 1 = when Chop's happiness or training goes up, show "Chop Happiness +N" /
; "Chop Training +N" beside the game's own
; happiness bar (bottom right). The bar itself always fills up smoothly.
GainPopup=1
; Where the popups appear, inside the game's HUD area (0,0 = top left, 1,1 = bottom
; right of the area that holds the minimap and bars). On ultrawide screens that
; area is the 16:9 part in the middle, so this follows the HUD on any screen.
GainX=0.95
GainY=0.90

[Happiness]
; Chop's happiness runs from 0 to 100. Above 66 he is happy, above 33 content,
; otherwise unhappy: he whines, wanders off and refuses tricks.
; Points gained:
WalkStart=5
WalkPerMinute=2
Fetch=3
Trick=1
Pet=5
; Minutes of play without Chop before he loses one point. 0 = never.
MinutesApartPerPointLost=10
LostWhenChopIsKilled=25

[Training]
; Training experience earned:
WalkPerMinute=1
Fetch=2
Trick=1
; Experience needed for each trick.
NeededForSit=20
NeededForPaw=60
NeededForBeg=120
NeededForPet=200

[Cooldowns]
; How long before the same reward can be earned again. They carry over when you
; reload or restart the game.
; Hours of in-game time between walk bonuses. 24 = once per in-game day (48 real minutes).
WalkGameHours=24
; Real minutes between rewards for fetch, for each trick, and for petting.
FetchMinutes=1
TrickMinutes=5
PetMinutes=10

[Collars]
; The first (green) collar is Chop's from the start. The other four are earned:
;   Collar 2  take Chop for this many walks (one counts per walk bonus, so one an in-game day)
;   Collar 3  this many balls brought back in fetch
;   Collar 4  keep his happiness at BondHappiness or above through BondDays in-game days of play
;             in a row. A day is 48 minutes of play; sleeping or skipping time does not count.
;   Collar 5  a rare find: each minute you walk together, FindChance percent chance he digs it up
; 1 = collars must be earned, 0 = all five available from the start
Locked=1
Walks=10
Fetches=50
BondHappiness=80
BondDays=3
FindChance=2

[Advanced]
; 0 = find Chop's saved data automatically. Only set this if the log says it was not found.
GlobalIndex=0

[Phone]
; 1 = the key opens the Chopagotchi app, 0 = it shows a one-line status message instead
App=1
; 1 = show a "Chopagotchi [F9]" tab above Franklin's phone when it is out
Hint=1
; Where the app sits (its centre) and its size. Positions are inside the game's HUD area
; (the 16:9 safe zone, also on ultrawide screens): 0,0 = its top left, 1,1 = its bottom right.
X=0.925
Y=0.807
Scale=1.0
; 1 = also put Chopagotchi on Franklin's real phone, which opens the app on the phone
; itself. If the game's phone data is not recognised the phone is left alone and the
; key still opens the app. 0 = never touch the real phone.
InPhone=1
; Where on the phone. 1 = a "Chopagotchi" row in the menu of the Checklist app, below
; "Open Missions" and "Progress". 0 = an icon of its own on the home screen.
InChecklist=1
; The next two are for the icon (InChecklist=0). The icon: one of 1 2 4 5 6 12 14 17 24 27 39 40 42 43 54 57 58 59 62 (the artwork
; the phone has for its home screen).
Icon=14
; Home-screen cell 0-8 (left to right, top to bottom), replacing whatever the game
; shows there. -1 = the free cell, or the Checklist app's when the screen is full.
Cell=-1
